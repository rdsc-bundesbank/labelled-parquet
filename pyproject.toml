[build-system]
requires = ["uv_build>=0.13.8,<0.14"]
build-backend = "uv_build"

[project]
name = "labelled-parquet"
version = "0.1.0"
description = "Read and write Parquet files with Stata-compatible labelled metadata"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "pyarrow>=16",
]

[project.optional-dependencies]
pandas = ["pandas>=2"]
polars = ["polars>=1"]

[project.urls]
Repository = "https://github.com/rdsc-bundesbank/labelled-parquet"
Issues = "https://github.com/rdsc-bundesbank/labelled-parquet/issues"

[dependency-groups]
dev = [
    "commitizen>=4",
    "duckdb>=1",
    "pandas>=2",
    "polars>=1",
    "pyrefly>=0.48",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.11",
]

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
update_changelog_on_bump = true
version_scheme = "semver"
version_provider = "pep621"

[tool.pytest.ini_options]
addopts = "--cov=src/labelled_parquet --cov-report=term-missing"
pythonpath = ["src"]
xfail_strict = true

[tool.ruff]
line-length = 99
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "N", "D1", "D419", "UP", "PD", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
"__init__.py" = ["F401"]

[tool.pyrefly]
project-includes = ["src/**/*.py", "tests/**/*.py"]
